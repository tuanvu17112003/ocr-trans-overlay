[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrtrans"
version = "0.1.0"
requires-python = ">=3.13"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["gpu: requires a CUDA GPU"]
testpaths = ["tests"]
addopts = "-m 'not gpu'"
